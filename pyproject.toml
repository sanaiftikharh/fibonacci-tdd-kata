[project]
name = "fibonacci-kata"
version = "0.1.0"
description = "A TDD kata: Fibonacci, from notebook exploration to a tested, published package"
readme = "README.md"
authors = [
    { name = "sanaiftikharh", email = "sanaiftikharh@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
fibonacci-tdd-kata = "fibonacci_tdd_kata:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "marimo>=0.24.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
exclude = ["notebooks"]
